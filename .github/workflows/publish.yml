on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pixi environment (Quarto, R, Python)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          activate-environment: default

      - name: Generate TXT for e-book readers
        run: pixi run python mybook/qmd_to_txt.py

      - name: Commit regenerated TXT/links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A mybook
          git diff --cached --quiet || { git commit -m "chore: regenerate txt [skip ci]" && git push; }

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: mybook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
