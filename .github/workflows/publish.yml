on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pixi environment (Quarto, R, Python)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
          activate-environment: default

      - name: Enable swap for large Quarto book render
        # The 137-chapter book needs more virtual memory than the runner's
        # RAM during Deno's in-memory render; without swap it OOMs at [138/138].
        # Runners may already ship an active /swapfile, so reset it first.
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Generate TXT for e-book readers
        run: pixi run python mybook/qmd_to_txt.py

      - name: Commit regenerated TXT/links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A mybook
          git diff --cached --quiet || { git commit -m "chore: regenerate txt [skip ci]" && git push; }

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: mybook
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Raise Deno's heap ceiling (default ~8 GB hits "heap limit" on this book).
          QUARTO_DENO_EXTRA_OPTIONS: "--v8-flags=--max-old-space-size=12288"
